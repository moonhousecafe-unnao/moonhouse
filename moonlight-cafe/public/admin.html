 const tabs=[['dash','📊 Dashboard'],['orders','📋 Orders'],['menu','🍽️ Menu'],['offers','🏷️ Offers'],['loyalty','🎁 Loyalty'],['wheel','🎡 Wheel'],['qr','🔳 Table QRs']];let b='';
 if(tab=='dash'){const inr=n=>'₹'+Math.round(n).toLocaleString('en-IN'),sum=L=>L.reduce((s,o)=>s+(o.total||0),0),dt=o=>o.t?.toDate?o.t.toDate():new Date(),

/* ----- PDF invoice (works in both admin & customer) ----- */
let curList=[];
const rs=n=>'₹'+Number(n||0).toLocaleString('en-IN'),odt=o=>o.t?.toDate?o.t.toDate():new Date(),
 fdt=d=>d.toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'})+', '+d.toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'});
const TH='padding:10px 12px;background:#161a45;color:#fff;font-size:12px;font-weight:600;',TD='padding:10px 12px;border-bottom:1px solid #e3e6f3;font-size:13px;';
const mrpOf=o=>o.items.reduce((s,i)=>s+(i.free?0:i.q*i.p),0);
function itemsTable(o){return `<table style="width:100%;border-collapse:collapse"><tr><th style="${TH}width:34px">#</th><th style="${TH}">Item</th><th style="${TH}text-align:center">Qty</th><th style="${TH}text-align:right">MRP</th><th style="${TH}text-align:right">Amount</th></tr>`+
 o.items.map((i,k)=>`<tr><td style="${TD}">${k+1}</td><td style="${TD}">${esc(i.n)}${i.free?' <span style="color:#3aa57a;font-size:11px">(Free gift)</span>':''}</td><td style="${TD}text-align:center">${i.q}</td><td style="${TD}text-align:right">${rs(i.p)}</td><td style="${TD}text-align:right;font-weight:600">${i.free?'FREE':rs(i.q*i.p)}</td></tr>`).join('')+`</table>`}
function totalsBox(o){const m=mrpOf(o),d=m-(o.total||0);return `<div style="margin-top:14px;margin-left:auto;width:260px;font-size:13px"><div style="display:flex;justify-content:space-between;padding:5px 0"><span>Total MRP</span><span>${rs(m)}</span></div>${d>0?`<div style="display:flex;justify-content:space-between;padding:5px 0;color:#3aa57a"><span>Discount</span><span>− ${rs(d)}</span></div>`:''}<div style="display:flex;justify-content:space-between;padding:10px 12px;margin-top:6px;background:#161a45;color:#fff;border-radius:8px;font-weight:700;font-size:15px"><span>Total</span><span>${rs(o.total)}</span></div></div>`}
function invHTML(list){const one=list.length==1,o0=list[0],cafe=esc(S.cafe),
 head=`<div style="background:#161a45;color:#fff;padding:28px 36px;display:flex;justify-content:space-between;align-items:center"><div><div style="font:700 26px 'Playfair Display',Georgia,serif">🌙 ${cafe}</div><div style="font-size:10px;letter-spacing:.2em;opacity:.75;margin-top:5px">CAFÉ · COFFEE UNDER THE STARS</div></div><div style="text-align:right"><div style="font:700 26px 'Playfair Display',Georgia,serif;color:#f2c96b;letter-spacing:.08em">${one?'INVOICE':'ORDER STATEMENT'}</div><div style="font-size:12px;opacity:.85;margin-top:5px">${one?'No. INV-'+esc(o0.no):list.length+' orders · '+fdt(new Date())}</div></div></div><div style="height:5px;background:#f2c96b"></div>`;
 let body='';
 if(one){body=`<div style="display:flex;justify-content:space-between;gap:20px;margin-bottom:22px"><div><div style="font-size:11px;color:#6b7194;letter-spacing:.1em">BILLED TO</div><div style="font:600 18px 'Playfair Display',Georgia,serif;margin:4px 0">${esc(o0.name||'')}</div><div style="font-size:13px">📞 ${esc(o0.phone||'')}</div></div><div style="text-align:right;font-size:13px;line-height:1.7"><div><span style="color:#6b7194">Date:</span> ${fdt(odt(o0))}</div><div><span style="color:#6b7194">Order:</span> #${esc(o0.no)}</div><div><span style="color:#6b7194">Table:</span> ${esc(o0.table||'-')}</div><div><span style="color:#6b7194">Status:</span> ${ST[o0.st]}</div></div></div>${itemsTable(o0)}${totalsBox(o0)}`}
 else{body=list.map(o=>`<div style="margin-bottom:22px"><div style="background:#eef0f9;border-radius:8px;padding:10px 12px;margin-bottom:6px;font-size:13px;display:flex;justify-content:space-between"><span><b>#${esc(o.no)}</b> · ${esc(o.name||'')} · ${esc(o.phone||'')}</span><span style="color:#6b7194">${fdt(odt(o))} · Table ${esc(o.table||'-')} · ${ST[o.st]}</span></div>${itemsTable(o)}<div style="text-align:right;font-weight:700;font-size:13px;margin-top:6px">Order total: ${rs(o.total)}</div></div>`).join('')+
  `<div style="display:flex;justify-content:space-between;padding:12px 14px;background:#161a45;color:#fff;border-radius:8px;font-weight:700;font-size:16px"><span>Grand total (${list.length} orders)</span><span>${rs(list.reduce((s,o)=>s+(o.total||0),0))}</span></div>`}
 return `<div style="font-family:Inter,system-ui,sans-serif;color:#1c2040;background:#fff;width:794px">${head}<div style="padding:28px 36px 20px">${body}</div><div style="padding:0 36px 28px;text-align:center;font-size:12px;color:#6b7194"><div style="border-top:1px dashed #d9ddf0;padding-top:14px">Thank you for visiting ${cafe}! 🌙 · This is a computer-generated invoice.</div></div></div>`}
async function makePDF(list,fname){if(!list.length)return alert('No orders to download.');if(!window.html2canvas||!window.jspdf)return alert('PDF library is still loading. Please check your internet and try again.');
 const host=document.createElement('div');host.style.cssText='position:fixed;left:-10000px;top:0;width:794px;background:#fff';host.innerHTML=invHTML(list);document.body.appendChild(host);
 try{if(document.fonts?.ready)await document.fonts.ready;const c=await html2canvas(host,{scale:2,backgroundColor:'#ffffff',useCORS:true}),pdf=new window.jspdf.jsPDF('p','pt','a4'),pw=pdf.internal.pageSize.getWidth(),ph=pdf.internal.pageSize.getHeight(),pch=Math.floor(c.width*ph/pw);
  for(let off=0,p=0;off<c.height;off+=pch,p++){const s=document.createElement('canvas');s.width=c.width;s.height=Math.min(pch,c.height-off);const x=s.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,s.width,s.height);x.drawImage(c,0,off,c.width,s.height,0,0,c.width,s.height);if(p)pdf.addPage();pdf.addImage(s.toDataURL('image/jpeg',.95),'JPEG',0,0,pw,s.height*pw/c.width)}
  pdf.save(fname)}catch(e){alert('Could not create PDF: '+e.message)}finally{host.remove()}}
const dlInv=id=>{const o=orders.find(x=>x.id==id);if(o)makePDF([o],'Invoice-'+o.no+'.pdf')},
 dlAll=()=>makePDF(curList,'Orders-'+new Date().toISOString().slice(0,10)+'.pdf');
function start(){
 onSnapshot(query(collection(db,'orders'),orderBy('t','desc')),s=>{orders=s.docs.map(d=>cleanO({id:d.id,...d.data()}));render()});
 onSnapshot(collection(db,'menu'),s=>{menu=s.docs.map(d=>({id:d.id,...d.data()}));render()});
 onSnapshot(query(collection(db,'wins'),orderBy('t','desc')),s=>{wins=s.docs.map(d=>({id:d.id,...d.data()}));render()});
 onSnapshot(collection(db,'customers'),s=>{members=s.docs.map(d=>({id:d.id,...d.data()}));render()});
 onSnapshot(cfgRef,s=>{if(s.exists())S={...S,...s.data()};render()})}
onAuthStateChanged(auth,async u=>{if(!u||u.isAnonymous){ready=false;return render()}
 const a=await getDoc(doc(db,'admins',u.uid));if(!a.exists()){msg='This account is not an admin. Add a document admins/'+u.uid+' in Firestore.';ready=false;return render()}
 if(!keep.on){keep.on=1;start()}ready=true;render()});
Object.assign(window,{db,auth,cfgRef,setDoc,signOut,render,dlInv,dlAll,
 setTab(v){tab=v;render()},setOF(v){ofil=v;render()},togToday(){otoday=!otoday;render()},
 async login(){try{await signInWithEmailAndPassword(auth,$('#em').value,$('#pw').value)}catch(e){msg=e.message;render()}},
 addW(){const v=$('#wp').value.trim();if(v)setDoc(cfgRef,{wheel:[...(S.wheel||[]),v]},{merge:true})},
 delW:i=>setDoc(cfgRef,{wheel:S.wheel.filter((_,k)=>k!=i)},{merge:true}),
 seedW:()=>setDoc(cfgRef,{wheel:['Free Cappuccino','Free Brownie','10% Off','Free Cookie','Free Masala Chai','Try Again']},{merge:true}),
 claim:id=>updateDoc(doc(db,'wins',id),{status:'claimed'}),
 async setSt(id,s){const o=orders.find(x=>x.id==id);if(!o||o.st==3)return alert('Served orders are locked and cannot be changed.');
  try{if(s!=3)return await updateDoc(doc(db,'orders',id),{st:s});
   const find=i=>menu.find(x=>x.id==i.id)||menu.find(x=>x.n==i.n),exp=o.items.reduce((t,i)=>{const m=find(i);return t+(m?i.q*m.p:NaN)},0);
   if(!confirm((exp!==o.total?'WARNING: order total is Rs '+o.total+' but the current menu says '+(isNaN(exp)?'(an item is not on the menu)':'Rs '+exp)+'.\n\n':'')+'Mark this order as Served? It cannot be changed afterwards.'))return;
   /* Loyalty stamps are awarded here, by staff, when the order is served - customers cannot write their own stamps. */
   const b=writeBatch(db),L=S.loy,cr=doc(db,'customers',o.uid);b.update(doc(db,'orders',id),{st:3});
   if(L.on&&L.n>0&&o.uid){const cs=await getDoc(cr);if(cs.exists()){let p=cs.data().paid||0,r=cs.data().rewards||0;o.items.forEach(i=>{const m=find(i);if(m?.loy){p+=i.q;while(p>=L.n){p-=L.n;r++}}});b.update(cr,{paid:p,rewards:r})}}
   await b.commit()}catch(e){alert(e.message)}},
 tg:(id,v)=>updateDoc(doc(db,'menu',id),{loy:v?1:0}),
 delM:id=>deleteDoc(doc(db,'menu',id)),
 addM(){const n=$('#mn').value.trim(),p=+$('#mp').value;if(!n||!p)return;addDoc(collection(db,'menu'),{n,p,e:$('#me').value||'🍽️',c:$('#mc').value||'Food',loy:0})},
 addO(){const v=$('#of').value.trim();if(v)setDoc(cfgRef,{offers:[...(S.offers||[]),v]},{merge:true})},
 delO:i=>setDoc(cfgRef,{offers:S.offers.filter((_,k)=>k!=i)},{merge:true}),
 saveL(on){const n=Math.max(1,+($('#ln')?.value)||S.loy.n),label=$('#ll')?.value||S.loy.label;setDoc(cfgRef,{loy:{on:on??S.loy.on,n,label}},{merge:true})},
 async seed(){const b=writeBatch(db);b.set(cfgRef,{cafe:'Moon Light',offers:['🌙 Night Owl: 15% off after 8 PM','⭐ Free cookie with any coffee, 4–6 PM'],loy:{on:true,n:6,label:'Coffee'},wheel:['Free Cappuccino','Free Brownie','10% Off','Free Cookie','Free Masala Chai','Try Again']},{merge:true});
  [['Cappuccino',120,'☕','Coffee',1],['Iced Latte',150,'🧋','Cold Drinks',1],['Cold Coffee',140,'🥤','Cold Drinks',1],['Masala Chai',60,'🍵','Non-Coffee',0],['Veg Sandwich',110,'🥪','Food',0],['Choco Brownie',90,'🍰','Food',0]].forEach(([n,p,e,c,loy])=>b.set(doc(collection(db,'menu')),{n,p,e,c,loy}));await b.commit()},
 qrs(){const n=+$('#tn').value||6,box=$('#qrs');box.innerHTML='';const base=location.href.split('?')[0].replace(/admin\.html$/,'customer.html');
  for(let i=1;i<=n;i++){const d=document.createElement('div');d.className='qr';const q=document.createElement('div');d.appendChild(q);d.append('Table '+i);box.appendChild(d);new QRCode(q,{text:base+'?table='+i,width:110,height:110})}}});
