<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline' https://www.gstatic.com https://cdnjs.cloudflare.com https://apis.google.com; style-src 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src https://*.googleapis.com https://*.firebaseio.com wss://*.firebaseio.com https://*.firebaseapp.com; frame-src https://*.firebaseapp.com https://*.google.com; base-uri 'none'; form-action 'none'; object-src 'none'"><meta name="referrer" content="no-referrer"><title>Moonhouse Café</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Dancing+Script:wght@700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--g:#161a45;--g2:#0a0d28;--cr:#eef0f9;--cd:#fbfbff;--tx:#1c2040;--mu:#6b7194;--au:#f2c96b;--ln:#d9ddf0;--ok:#3aa57a;box-sizing:border-box}
@media (prefers-color-scheme:dark){:root{--cr:#0b0e2a;--cd:#151a45;--tx:#eef0ff;--mu:#a3a9d4;--ln:#2a3070}}
*{box-sizing:border-box}body{margin:0;background:var(--cr);color:var(--tx);font:15px/1.45 Inter,system-ui,sans-serif;padding-top:env(safe-area-inset-top,0px)}
h1,h2,h3{font-family:'Playfair Display',Georgia,serif;margin:0}.sc{font-family:'Dancing Script',cursive;color:var(--au)}
.w{max-width:680px;margin:0 auto;padding:0 16px 150px}.mu{color:var(--mu);font-size:13px}.row{display:flex;gap:10px;align-items:center;justify-content:space-between}
.top{background:var(--g);color:#fff;position:sticky;top:0;z-index:20;padding:12px 16px}.top>div{max-width:680px;margin:auto;display:flex;align-items:center;gap:10px}
.logo{flex:1;font:700 20px 'Playfair Display',Georgia,serif}.logo small{display:block;font:500 9px Inter,sans-serif;letter-spacing:.2em;opacity:.7}.logo span{display:inline-block;animation:sway 3s ease-in-out infinite}
.chip{background:#ffffff1f;border-radius:99px;padding:5px 12px;font-size:13px}
button{font:600 14px Inter,sans-serif;border:0;border-radius:99px;padding:10px 18px;background:var(--g);color:#fff;cursor:pointer;transition:transform .15s,box-shadow .2s}
button:hover{transform:translateY(-2px);box-shadow:0 6px 16px rgba(22,26,69,.35)}button:active{transform:scale(.95)}
button.au{background:var(--au);color:#3a2a08}button.g{background:transparent;color:var(--g);border:1.5px solid var(--g)}button.s{padding:6px 12px;font-size:13px}
@media (prefers-color-scheme:dark){button{background:#2d3380}button.g{color:var(--au);border-color:var(--au)}button.au{background:var(--au)}}
input,select{font:inherit;width:100%;padding:12px 14px;border-radius:12px;border:1.5px solid var(--ln);background:var(--cd);color:var(--tx);margin:5px 0}input:focus{outline:0;border-color:var(--au);box-shadow:0 0 0 3px rgba(242,201,107,.3)}
.card{background:var(--cd);border:1px solid var(--ln);border-radius:18px;padding:14px;margin:12px 0}
.hero{background:radial-gradient(circle at 80% 30%,#3b429c,var(--g) 60%,var(--g2));color:#fff;border-radius:22px;margin:14px 0;padding:24px 20px;display:flex;align-items:center;gap:8px;overflow:hidden;position:relative}
.hero:before{content:'';position:absolute;inset:0;opacity:.8;background-image:radial-gradient(2px 2px at 20px 30px,#fff,transparent),radial-gradient(1.5px 1.5px at 90px 80px,#fff,transparent),radial-gradient(2px 2px at 170px 20px,#fff,transparent),radial-gradient(1.5px 1.5px at 240px 95px,#fff,transparent),radial-gradient(2px 2px at 310px 45px,#fff,transparent);background-size:340px 130px;animation:tw 2.6s ease-in-out infinite alternate}
.hero .t{flex:1;z-index:1}.hero small{letter-spacing:.2em;font-size:10px;opacity:.75}.hero h1{font-size:28px;line-height:1.1;margin:6px 0}.hero .sc{font-size:38px;display:block;line-height:1}
.moonw{width:110px;height:130px;position:relative;animation:float 4s ease-in-out infinite}.moon{position:absolute;left:10px;top:24px;width:92px;height:92px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fffbe6,#f7d98a 55%,#dca94a);animation:glowm 3.5s ease-in-out infinite}
.moon:before,.moon:after{content:'';position:absolute;border-radius:50%;background:rgba(160,110,30,.22)}.moon:before{width:20px;height:20px;left:52px;top:18px}.moon:after{width:13px;height:13px;left:24px;top:56px}
.mq{display:flex;gap:10px;overflow-x:auto;padding:2px 0 8px;scrollbar-width:none}.of{flex:none;max-width:260px;background:linear-gradient(135deg,var(--au),#f8dd9c);color:#3a2a08;border-radius:14px;padding:10px 14px;font-size:13px;font-weight:600}
.chips,.tabs{display:flex;gap:8px;overflow-x:auto;margin:10px 0;scrollbar-width:none}.chips button,.tabs button{background:var(--cd);color:var(--tx);border:1px solid var(--ln);flex:none}.chips button.on,.tabs button.on{background:var(--g);color:#fff;border-color:var(--g)}
.it{display:flex;align-items:center;gap:12px;background:var(--cd);border:1px solid var(--ln);border-radius:18px;padding:12px;margin:10px 0}.em{font-size:34px;width:62px;height:62px;border-radius:16px;background:var(--cr);display:grid;place-items:center}.inf{flex:1}.inf b{font:600 16px 'Playfair Display',Georgia,serif}
.tag{font-size:11px;background:var(--au);color:#3a2a08;border-radius:99px;padding:2px 8px;font-weight:600}.pr{font-weight:600}
.qty{display:flex;align-items:center;gap:9px}.qty button{width:32px;height:32px;padding:0;font-size:18px}.qty b{min-width:18px;text-align:center}.bump{animation:bump .3s}
.fu{animation:fu .5s both;animation-delay:calc(var(--i,0)*70ms)}.na .fu{animation:none}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--g);padding:8px 8px calc(8px + env(safe-area-inset-bottom,0px))}.nav>div{max-width:680px;margin:auto;display:flex}
.nav a{flex:1;text-align:center;color:#ffffffa0;font-size:11px;padding:6px 0;border-radius:14px;cursor:pointer;position:relative}.nav a i{display:block;font-style:normal;font-size:21px;transition:transform .3s}.nav a.on{color:var(--au);background:#ffffff14}.nav a.on i{transform:translateY(-3px) scale(1.2)}
.bd{position:absolute;top:0;right:22%;background:var(--au);color:#3a2a08;border-radius:99px;font:700 10px Inter,sans-serif;padding:1px 6px;display:none}
#cb{position:fixed;left:16px;right:16px;bottom:calc(76px + env(safe-area-inset-bottom,0px));max-width:648px;margin:auto;z-index:25;transform:translateY(140%);transition:transform .4s cubic-bezier(.2,1.4,.4,1)}#cb.show{transform:none}
#cb div{background:var(--au);color:#3a2a08;border-radius:99px;padding:8px 8px 8px 20px;display:flex;justify-content:space-between;align-items:center;font-weight:600;box-shadow:0 10px 28px rgba(0,0,0,.3)}#cb button{background:var(--g);color:#fff}
.trk{position:relative;display:flex;justify-content:space-between;margin:18px 6px 6px}.trk:before,.trk u{content:'';position:absolute;top:19px;left:8%;height:4px;border-radius:4px;background:var(--ln)}.trk:before{right:8%}.trk u{background:var(--ok);width:calc(84%*var(--p));transition:width 1s}
.sp{position:relative;z-index:1;text-align:center;font-size:11px;color:var(--mu);width:25%}.sp i{width:42px;height:42px;border-radius:50%;background:var(--cr);border:3px solid var(--ln);display:grid;place-items:center;margin:0 auto 4px;font-style:normal;font-size:18px}.sp.on i{border-color:var(--ok)}.sp.cur i{animation:pulse 1.6s infinite}.sp.on{color:var(--tx);font-weight:600}
.ringw{position:relative;width:170px;height:170px;margin:6px auto}.ringw svg{transform:rotate(-90deg)}.ringw .c{position:absolute;inset:0;display:grid;place-content:center;text-align:center}.ringw .c b{font:700 34px 'Playfair Display',Georgia,serif}.ring{stroke-dasharray:339.3;animation:ring 1.4s ease-out both}
.stamps{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:10px 0}.stamps b{width:38px;height:38px;border-radius:50%;border:2px dashed var(--au);display:grid;place-items:center;font-size:17px}.stamps b.on{background:var(--au);border-style:solid;animation:pop .5s both;animation-delay:calc(var(--i)*90ms)}
.gift{background:linear-gradient(135deg,var(--g),#3b429c);color:#fff;border-radius:18px;padding:16px;text-align:center;animation:glowm 2s infinite}
.qr{display:inline-block;margin:8px;text-align:center;font-size:13px}.qr div{background:#fff;padding:6px;border-radius:10px}
.cf{position:fixed;top:-30px;z-index:99;pointer-events:none;animation:fall 2.2s linear forwards;font-size:22px}
.wheel{position:relative;width:min(290px,78vw);aspect-ratio:1;margin:18px auto}.whin{width:100%;height:100%;border-radius:50%;box-shadow:0 0 0 8px var(--au),0 12px 40px rgba(0,0,0,.35)}.whin svg{width:100%;height:100%;display:block}
.ptr{position:absolute;top:-16px;left:50%;margin-left:-12px;width:0;height:0;border:12px solid transparent;border-top:28px solid #e0644f;z-index:3;filter:drop-shadow(0 2px 2px rgba(0,0,0,.4))}
.box{font-size:84px;display:inline-block;animation:wob 1.6s ease-in-out infinite;cursor:pointer}.burst{animation:burst .9s forwards}
@keyframes wob{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(6deg) scale(1.08)}}@keyframes burst{0%{transform:scale(1)}40%{transform:scale(1.5) rotate(12deg)}100%{transform:scale(2.6);opacity:0}}
@keyframes fu{from{opacity:0;transform:translateY(18px)}}@keyframes pop{from{opacity:0;transform:scale(.4)}}@keyframes bump{50%{transform:scale(1.5)}}@keyframes float{50%{transform:translateY(-10px)}}@keyframes sway{50%{transform:rotate(12deg)}}
@keyframes tw{from{opacity:.25}to{opacity:1}}@keyframes glowm{0%,100%{box-shadow:0 0 30px 6px rgba(247,217,138,.35)}50%{box-shadow:0 0 56px 16px rgba(247,217,138,.6)}}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(58,165,122,.6)}100%{box-shadow:0 0 0 14px transparent}}@keyframes ring{from{stroke-dashoffset:339.3}}@keyframes fall{to{transform:translateY(110vh) rotate(540deg);opacity:.2}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body><div id="app"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script type="module">
import {firebaseConfig} from "./firebase-config.js"; /* generated from .env by scripts/make-config.js (gitignored) */
/* Customers log in with name + phone number (free Email/Password auth). The email is built from the name; it is never emailed. */
const MAILDOMAIN="@moonlight-cafe.com";
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getFirestore,collection,doc,onSnapshot,query,where,runTransaction,serverTimestamp,getDoc,setDoc} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import {getAuth,onAuthStateChanged,signInWithEmailAndPassword,createUserWithEmailAndPassword,signOut} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
const db=getFirestore(initializeApp(firebaseConfig)),auth=getAuth();
const DW=['Free Cappuccino','Free Brownie','10% Off','Free Cookie','Free Masala Chai','Try Again'];
const ST=['Placed','Preparing','Ready','Served'],IC=['📝','👨‍🍳','🛎️','✅'];
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let menu=[],S={cafe:'Moonhouse',offers:[],loy:{on:true,n:6,label:'Coffee'}},orders=[],wins=[],gift=null,busy=false,cu={paid:0,rewards:0},cart={},tab='items',cat='All',unsubs=[],me=null;

const table=(new URLSearchParams(location.search).get('table')||'?').slice(0,10);
function render(a=0){if(busy)return;document.body.classList.toggle('na',!a);$('#app').innerHTML=view();bar()}
const hdr=r=>`<div class="top"><div><div class="logo"><span>🌙</span> ${esc(S.cafe)}<small>CAFÉ · COFFEE UNDER THE STARS</small></div>${r}</div></div>`;
const moon=()=>`<div class="moonw"><div class="moon"></div></div>`;
const hero=()=>`<div class="hero fu"><div class="t"><small>MIDNIGHT BREWS & SWEET BITES</small><h1>Good Coffee at <span class="sc">${esc(S.cafe)}</span></h1></div>${moon()}</div>`;
let err='',pend=null,last=null;
const slug=n=>[...n.toLowerCase().replace(/\s+/g,'')].map(ch=>/[a-z0-9]/.test(ch)?ch:ch.codePointAt(0).toString(16)).join('').slice(0,60);
onAuthStateChanged(auth,async u=>{
 if(!u){me=null;orders=[];wins=[];gift=null;cu={paid:0,rewards:0};listen();return render(1)}
 const ref=doc(db,'customers',u.uid);let sn=await getDoc(ref);const fresh=!!pend;
 if(!sn.exists()){if(!pend){me=null;return render(1)}  /* e.g. an admin session on this device */
  await setDoc(ref,{name:pend.name,phone:pend.phone,paid:0,rewards:0,spins:0,joined:serverTimestamp()});sn=await getDoc(ref)}
 const d=sn.data();me={name:d.name,phone:d.phone};pend=null;err='';listen();render(1);if(fresh)boom('🌙')});
onSnapshot(collection(db,'menu'),s=>{menu=s.docs.map(d=>({id:d.id,...d.data()}));render()});
onSnapshot(doc(db,'settings','config'),s=>{if(s.exists())S={...S,...s.data()};render()});
function listen(){unsubs.forEach(u=>u());unsubs=[];if(!me)return;
 unsubs.push(onSnapshot(query(collection(db,'orders'),where('uid','==',auth.currentUser.uid)),s=>{orders=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(b.t?.seconds||9e9)-(a.t?.seconds||9e9));render()}));
 unsubs.push(onSnapshot(query(collection(db,'wins'),where('uid','==',auth.currentUser.uid)),s=>{wins=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(b.t?.seconds||9e9)-(a.t?.seconds||9e9));render()}));
 unsubs.push(onSnapshot(doc(db,'customers',auth.currentUser.uid),s=>{cu=s.exists()?s.data():{paid:0,rewards:0};render()}))}
function loginCard(){const e=err?`<p style="color:#e0644f;font-size:13px">${esc(err)}</p>`:'';
 return `<div class="card fu"><h3>Welcome 🌙</h3><p class="mu">Enter your name and phone number. New here? We create your account. Coming back? Use the same name and number to see your rewards on any device.</p>${e}<input id="nm" placeholder="Your name (e.g. Rahul Sharma)" value="${esc(last?.name||'')}"><input id="ph" type="tel" inputmode="numeric" placeholder="Phone number (10 digits)" value="${esc(last?.phone||'')}"><button onclick="join()" style="width:100%;margin-top:6px">Continue</button></div>`}
function view(){
 if(!me)return hdr(`<span class="chip">Table ${esc(table)}</span>`)+`<div class="w">${hero()}${loginCard()}</div>`;
 const T={items,orders:ordersV,status,rewards}[tab](),nav=[['items','🍽️','Items'],['orders','🧾','Orders'],['status','⏱️','Status'],['rewards','🎁','Rewards']];
 return hdr(`<span class="chip">Table ${esc(table)}</span><button class="s au" onclick="logout()">${esc(me.name.split(' ')[0])} ⏏</button>`)+`<div class="w">${T}</div><div id="cb"></div><div class="nav"><div>${nav.map(n=>`<a class="${tab==n[0]?'on':''}" onclick="go('${n[0]}')"><i>${n[1]}</i>${n[2]}${n[0]=='orders'?'<span class="bd" id="bd"></span>':''}</a>`).join('')}</div></div>`}
function items(){const cats=['All',...new Set(menu.map(m=>m.c))];
 return hero()+`<div class="mq">${(S.offers||[]).map(o=>`<div class="of">${esc(o)}</div>`).join('')}</div><div class="chips">${cats.map(c=>`<button class="${cat==c?'on':''}" onclick="setCat(this.textContent)">${esc(c)}</button>`).join('')}</div>`+
 (menu.length?menu.filter(m=>cat=='All'||m.c==cat).map((m,i)=>`<div class="it fu" style="--i:${i}"><div class="em">${m.e||'🍽️'}</div><div class="inf"><b>${esc(m.n)}</b><div class="pr">₹${m.p} ${S.loy.on&&m.loy?'<span class="tag">⭐ earns stamp</span>':''}</div></div><div class="qty"><button class="g s" onclick="chg('${m.id}',-1)">−</button><b id="q${m.id}">${cart[m.id]||0}</b><button onclick="chg('${m.id}',1)">+</button></div></div>`).join(''):'<p class="mu">Menu is loading… (admin: add items in admin.html)</p>')}
/* ----- loyalty counting: pure function, used for preview AND inside the Firestore transaction ----- */
function calc(c){const L=S.loy;let items=[],total=0,earned=0;
 for(const [id,q] of Object.entries(cart)){if(!q)continue;const m=menu.find(x=>x.id==id);if(!m)continue;total+=q*m.p;items.push({id,n:m.n,q,p:m.p,e:m.e||''});
  if(L.on&&m.loy){c.paid+=q;while(c.paid>=L.n){c.paid-=L.n;c.rewards++;earned++}}}
 return {items,total,cc:c,earned}}
function ordersV(){const n=Object.values(cart).reduce((a,b)=>a+b,0),r=n?calc({paid:cu.paid||0,rewards:cu.rewards||0}):null;
 return `<h2 style="margin:18px 0 4px">Your order</h2>`+(n?`<div class="card">${r.items.map(i=>`<div class="row" style="margin:6px 0"><span>${i.e} ${i.q}× ${esc(i.n)} ${i.free?'<span class="tag">FREE 🎁</span>':''}</span><b>₹${i.q*i.p}</b></div>`).join('')}<hr style="border:0;border-top:1px dashed var(--ln)"><div class="row"><b>Total</b><h3>₹${r.total}</h3></div><div class="row" style="margin-top:10px"><button class="g" onclick="clearCart()">Clear</button><button onclick="place()">Place order</button></div></div>`:`<div class="card mu" style="text-align:center">🛒 Your cart is empty. <a onclick="go('items')" style="color:var(--au);cursor:pointer">Browse items</a></div>`)+
 `<div class="row" style="margin:22px 0 4px"><h2>Order history</h2>${orders.length?`<button class="s au" onclick="dlAll()">⬇ All orders</button>`:''}</div>`+(orders.length?orders.map(o=>`<div class="card"><div class="row"><b>#${o.no}</b><span class="mu">${o.t?.toDate?o.t.toDate().toLocaleString([], {hour:'2-digit',minute:'2-digit',day:'numeric',month:'short'}):'…'}</span></div><div class="mu">${o.items.map(i=>`${i.q}× ${esc(i.n)}${i.free?' 🎁':''}`).join(', ')}</div><div class="row"><b>₹${o.total}</b><span class="tag">${ST[o.st]}</span></div><button class="g s" style="margin-top:8px" onclick="dlInv('${o.id}')">⬇ Download invoice</button></div>`).join(''):'<p class="mu">No orders yet.</p>')}
function status(){return `<h2 style="margin:18px 0 4px">Live order status</h2>`+(orders.length?orders.slice(0,5).map(o=>`<div class="card"><div class="row"><b>Order #${o.no}</b><span class="mu">Table ${esc(o.table)}</span></div><div class="trk" style="--p:${o.st/3}"><u></u>${ST.map((s,k)=>`<div class="sp ${k<=o.st?'on':''} ${k==o.st&&o.st<3?'cur':''}"><i>${IC[k]}</i>${s}</div>`).join('')}</div><div class="mu" style="text-align:center;margin-top:8px">${['We got your order!','Our baristas are on it…','Ready! Coming to your table.','Enjoy your treat 💛'][o.st]}</div></div>`).join(''):`<div class="card mu" style="text-align:center">No orders yet. <a onclick="go('items')" style="color:var(--au);cursor:pointer">Order now</a></div>`)}
const PAL=[['#2d3380','#fff'],['#f2c96b','#3a2a08'],['#161a45','#fff'],['#f8dd9c','#3a2a08']];
const prizes=()=>(S.wheel&&S.wheel.length>1)?S.wheel:DW;
function wheelSVG(W){const n=W.length,a=360/n,r=96,pt=t=>[(r*Math.sin(t*Math.PI/180)).toFixed(2),(-r*Math.cos(t*Math.PI/180)).toFixed(2)];
 return `<svg viewBox="-100 -100 200 200">`+W.map((w,i)=>{const [x1,y1]=pt(i*a),[x2,y2]=pt((i+1)*a),[f,tc]=PAL[i%4];
  return `<path d="M0 0L${x1} ${y1}A${r} ${r} 0 0 1 ${x2} ${y2}Z" fill="${f}" stroke="#fff" stroke-width=".8"/><text transform="rotate(${(i*a+a/2-90).toFixed(2)}) translate(24,0)" font-size="${n>8?6:7.5}" font-weight="700" fill="${tc}" font-family="Inter,sans-serif" dy=".35em">${esc(String(w).slice(0,16))}</text>`}).join('')+`<circle r="9" fill="#fff"/><circle r="5" fill="#f2c96b"/></svg>`}
function rewards(){const L=S.loy,paid=cu.paid||0,rw=cu.rewards||0;if(!L.on)return `<div class="card"><h3>Rewards</h3><p class="mu">No loyalty program right now.</p></div>`;
 const p=paid%L.n/L.n;let top='';
 if(gift&&gift.prize)top=`<div class="card gift"><div style="font-size:40px">🎉</div><h3>You won!</h3><div style="font:700 24px 'Playfair Display',Georgia,serif;margin:8px 0">${esc(gift.prize)}</div><div style="opacity:.85">Show this screen to our staff to claim it.</div><button class="au" style="margin-top:12px" onclick="closeGift()">${rw?'Open next gift':'Done'}</button></div>`;
 else if(gift=='wheel')top=`<div class="card" style="text-align:center"><h3>Spin the wheel!</h3><div class="wheel"><div class="ptr"></div><div id="wh" class="whin">${wheelSVG(prizes())}</div></div><button class="au" id="spb" onclick="spin()" style="min-width:180px">SPIN 🎡</button></div>`;
 else if(gift=='opening')top=`<div class="card" style="text-align:center"><div class="box burst">🎁</div></div>`;
 else if(rw)top=`<div class="card gift" style="cursor:pointer" onclick="openGift()"><div class="box">🎁</div><h3>${rw} gift${rw>1?'s':''} waiting!</h3><div style="opacity:.9">Tap the box to open it</div></div>`;
 return `<h2 style="margin:18px 0 4px">${esc(S.cafe)} Rewards</h2><p class="mu">Buy ${L.n} ${esc(L.label)}, then open a gift box and spin the wheel to win a prize.</p>${top}

function bar(){const n=Object.values(cart).reduce((a,b)=>a+b,0),t=Object.entries(cart).reduce((s,[id,q])=>{const m=menu.find(x=>x.id==id);return s+(m?q*m.p:0)},0),b=$('#cb'),d=$('#bd');

const TH='padding:10px 12px;background:#161a45;color:#fff;font-size:12px;font-weight:600;',TD='padding:10px 12px;border-bottom:1px solid #e3e6f3;font-size:13px;';

function invHTML(list){const one=list.length==1,o0=list[0],cafe=esc(S.cafe),

 let body='';
 if(one){body=`<div style="display:flex;justify-content:space-between;gap:20px;margin-bottom:22px"><div><div style="font-size:11px;color:#6b7194;letter-spacing:.1em">BILLED TO</div><div style="font:600 18px 'Playfair Display',Georgia,serif;margin:4px 0">${esc(o0.name||'')}</div><div style="font-size:13px">📞 ${esc(o0.phone||'')}</div></div><div style="text-align:right;font-size:13px;line-height:1.7"><div><span style="color:#6b7194">Date:</span> ${fdt(odt(o0))}</div><div><span style="color:#6b7194">Order:</span> #${esc(o0.no)}</div><div><span style="color:#6b7194">Table:</span> ${esc(o0.table||'-')}</div><div><span style="color:#6b7194">Status:</span> ${ST[o0.st]}</div></div></div>${itemsTable(o0)}${totalsBox(o0)}`}
 else{body=list.map(o=>`<div style="margin-bottom:22px"><div style="background:#eef0f9;border-radius:8px;padding:10px 12px;margin-bottom:6px;font-size:13px;display:flex;justify-content:space-between"><span><b>#${esc(o.no)}</b> · ${esc(o.name||'')} · ${esc(o.phone||'')}</span><span style="color:#6b7194">${fdt(odt(o))} · Table ${esc(o.table||'-')} · ${ST[o.st]}</span></div>${itemsTable(o)}<div style="text-align:right;font-weight:700;font-size:13px;margin-top:6px">Order total: ${rs(o.total)}</div></div>`).join('')+
  `<div style="display:flex;justify-content:space-between;padding:12px 14px;background:#161a45;color:#fff;border-radius:8px;font-weight:700;font-size:16px"><span>Grand total (${list.length} orders)</span><span>${rs(list.reduce((s,o)=>s+(o.total||0),0))}</span></div>`}
 return `<div style="font-family:Inter,system-ui,sans-serif;color:#1c2040;background:#fff;width:794px">${head}<div style="padding:28px 36px 20px">${body}</div><div style="padding:0 36px 28px;text-align:center;font-size:12px;color:#6b7194"><div style="border-top:1px dashed #d9ddf0;padding-top:14px">Thank you for visiting ${cafe}! 🌙 · This is a computer-generated invoice.</div></div></div>`}
async function makePDF(list,fname){if(!list.length)return alert('No orders to download.');if(!window.html2canvas||!window.jspdf)return alert('PDF library is still loading. Please check your internet and try again.');
 const host=document.createElement('div');host.style.cssText='position:fixed;left:-10000px;top:0;width:794px;background:#fff';host.innerHTML=invHTML(list);document.body.appendChild(host);
 try{if(document.fonts?.ready)await document.fonts.ready;const c=await html2canvas(host,{scale:2,backgroundColor:'#ffffff',useCORS:true}),pdf=new window.jspdf.jsPDF('p','pt','a4'),pw=pdf.internal.pageSize.getWidth(),ph=pdf.internal.pageSize.getHeight(),pch=Math.floor(c.width*ph/pw);
  for(let off=0,p=0;off<c.height;off+=pch,p++){const s=document.createElement('canvas');s.width=c.width;s.height=Math.min(pch,c.height-off);const x=s.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,s.width,s.height);x.drawImage(c,0,off,c.width,s.height,0,0,c.width,s.height);if(p)pdf.addPage();pdf.addImage(s.toDataURL('image/jpeg',.95),'JPEG',0,0,pw,s.height*pw/c.width)}
  pdf.save(fname)}catch(e){alert('Could not create PDF: '+e.message)}finally{host.remove()}}
